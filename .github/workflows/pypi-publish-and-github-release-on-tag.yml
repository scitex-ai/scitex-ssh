name: release

# Tag-driven release on the selected self-hosted runner and verified CI SIF.
# All three Python test legs must pass before building, PyPI OIDC publication,
# and the automatic GitHub Release. Main promotion remains a separate PR.
# Correct failed candidates through a new qualified version; keep tags immutable.
# Shared admission selects the CPU pool; SCITEX_CI_SIF/APPTAINER select the image/runtime,
# and SCITEX_CI_SIF_SHA256 verifies the image before executing any inner script.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
  SCITEX_CI_SIF_SHA256: ${{ vars.SCITEX_CI_SIF_SHA256 || 'aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5' }}
  RUN_E2E: "1"

jobs:
  runner-admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@d7d96c34d68cdfbb5503a933591f7748b5aa30ee
    permissions: {}
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@103726f97249dcb1bf9c37ad235dec991a0399f9
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: [pytest-matrix, runner-admission]
    runs-on: >-
      ${{ needs.runner-admission.outputs.native_authorized == 'true'
          && fromJSON('{"group":"Organization","labels":["self-hosted","Linux","X64","scitex-org-cpu"]}')
          || fromJSON('["ubuntu-latest"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve version
        id: ver
        env:
          SCITEX_SSH_RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF" == refs/tags/* ]]
            v="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            v="$SCITEX_SSH_RELEASE_TAG"
          else
            exit 1
          fi
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - name: Record the tagged build source
        id: source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          # The shared native suite checks the triggering commit. A manual
          # dispatch may publish only a tag at that same commit, never another tree.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ssh_release_source_sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$ssh_release_source_sha" >> "$GITHUB_OUTPUT"
      # Build INSIDE the SIF (no setup-python on the bare Spartan node).
      # build-in-sif.sh installs the `build` frontend into a writable --target
      # inside the SIF, then `python -m build` → dist/. fail-loud on empty dist.
      - name: Build wheel + sdist in the CI SIF (apptainer exec)
        run: bash .github/ci/exec-in-sif.sh build-in-sif.sh 3.12 "${{ steps.ver.outputs.version }}"
      # upload-artifact is a JS action — runs fine on the self-hosted runner.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/

  publish:
    needs: [build, runner-admission]
    runs-on: >-
      ${{ needs.runner-admission.outputs.native_authorized == 'true'
          && fromJSON('{"group":"Organization","labels":["self-hosted","Linux","X64","scitex-org-cpu"]}')
          || fromJSON('["ubuntu-latest"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-ssh
    # id-token: write is what populates ACTIONS_ID_TOKEN_REQUEST_{TOKEN,URL},
    # which publish-in-sif.sh uses to mint the OIDC JWT. Keep it.
    permissions:
      id-token: write
    steps:
      # Need the repo checked out so .github/ci/exec-in-sif.sh +
      # publish-in-sif.sh are on disk (the build job uploaded only dist/).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      # The per-job OIDC JWT is exchanged for a scoped PyPI upload token inside
      # the verified SIF. Failed trust, authentication, or upload stops release.
      - name: Publish to PyPI via manual OIDC trusted publishing in the SIF
        run: bash .github/ci/exec-in-sif.sh publish-in-sif.sh 3.12

  release:
    needs: [build, publish, runner-admission]
    runs-on: >-
      ${{ needs.runner-admission.outputs.native_authorized == 'true'
          && fromJSON('{"group":"Organization","labels":["self-hosted","Linux","X64","scitex-org-cpu"]}')
          || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      # Use the job token through the action rather than the operator's
      # machine-local gh configuration. Publication remains a prerequisite.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
