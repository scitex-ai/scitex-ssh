name: CLA Assistant

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable workflow defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) already match
# this repo's prior hardcoded values, so no `with:` overrides are needed.
# This repo's `GH_PERSONAL_ACCESS_TOKEN` secret already matches the name
# the reusable workflow expects.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # NAMED SECRET, not `secrets: inherit`. This caller fires on
    # `issue_comment` and `pull_request_target`, both of which an
    # UNAUTHENTICATED outsider can trigger on a public repo, so `inherit`
    # would forward EVERY secret this repository holds into a job a stranger
    # caused to run -- on the shared, persistent self-hosted runner the
    # callee may target. Neither file reveals that alone: the caller names no
    # `runs-on`, so the destination lives in the callee. Pass ONLY the one
    # secret the callee declares (`GH_PERSONAL_ACCESS_TOKEN`, required).
    # Audit rule PS-224 flags the `inherit` form; `inherit` is not a
    # convenience here, it is the vulnerability.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
