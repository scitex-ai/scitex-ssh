name: CLA Assistant

# The previous inline action still targeted the deleted cla-signatures branch.
# Use the accepted shared consent workflow and organization signature ledger.
# Keep the existing triggers, token permissions, and owner allowlist unchanged.
# Pin code because these events can be triggered by untrusted contributors.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    uses: scitex-ai/.github/.github/workflows/cla.yml@49ecabbd7e6876f1712f43c1f6b901aa77f4b1ae
    with:
      owner_allowlist: "bot*,ywatanabe1989"
    # Forward only the secret declared by the reusable workflow.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
