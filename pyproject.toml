[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-ssh"
version = "1.0.1"
description = "SSH primitives for SciTeX (exec/copy/attach/tunnel; per-host allowlist)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "scitex",
    "ssh",
    "exec",
    "scp",
    "tunnel",
    "reverse-tunnel",
    "nat-traversal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = ["click>=8.0.0", "pyyaml>=6.0"]

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.0.0",
]
dev = [
    "fastmcp>=2.0.0",
    "pytest-cov>=4.0.0",
    "pytest>=7.0.0",
    "scitex_dev",
    "scitex-dev>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-ssh[mcp]",
]

[project.scripts]
scitex-ssh = "scitex_ssh.cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-ssh = "scitex_ssh"

[project.entry-points."scitex_dev.skills"]
scitex-ssh = "scitex_ssh"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-ssh"
Repository = "https://github.com/ywatanabe1989/scitex-ssh"
Documentation = "https://scitex-ssh.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_ssh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
parallel = true
source = ["scitex_ssh"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
