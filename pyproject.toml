[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-ssh"
version = "1.0.0"
description = "SSH primitives for SciTeX (exec/copy/attach/tunnel; per-host allowlist)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "scitex",
    "ssh",
    "exec",
    "scp",
    "tunnel",
    "reverse-tunnel",
    "nat-traversal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = ["click>=8.0.0", "pyyaml>=6.0"]

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.0.0",
]
dev = [
    "fastmcp>=2.0.0",
    "pytest-cov>=4.0.0",
    "pytest>=7.0.0",
    "scitex_dev",
    "scitex-dev>=0.11.5",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-ssh[mcp]",
]

[project.scripts]
scitex-ssh = "scitex_ssh.cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-ssh = "scitex_ssh"

[project.entry-points."scitex_dev.skills"]
scitex-ssh = "scitex_ssh"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-ssh"
Repository = "https://github.com/ywatanabe1989/scitex-ssh"
Documentation = "https://scitex-ssh.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_ssh"]

[tool.hatch.build.targets.wheel.force-include]
"src/scitex_ssh/_sphinx_html" = "scitex_ssh/_sphinx_html"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]
