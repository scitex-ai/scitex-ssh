[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-tunnel"
version = "0.2.0"
description = "Persistent SSH reverse tunnel for SciTeX (NAT traversal)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "scitex",
    "ssh",
    "tunnel",
    "reverse-tunnel",
    "nat-traversal",
    "autossh",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = ["click>=8.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "scitex_dev",
]
mcp = [
    "fastmcp>=2.0.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "click>=8.0.0",
    "fastmcp>=2.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.scripts]
scitex-tunnel = "scitex_tunnel.cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-tunnel = "scitex_tunnel"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-tunnel"
Repository = "https://github.com/ywatanabe1989/scitex-tunnel"
Documentation = "https://scitex-tunnel.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_tunnel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
