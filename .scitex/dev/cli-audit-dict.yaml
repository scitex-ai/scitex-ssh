# scitex-dev audit-cli — per-package vocabulary additions
#
# Format expected by scitex_dev/_cli/audit/_summary/_audit.py::_load_custom_dict():
#   nouns:            [...]
#   transitive_verbs: [...]
#   intransitive_verbs: [...]
#
# Keys must match exactly. The auditor merges this dict with its base
# catalog + Moby POS, then classifies each CLI sub-command token.

intransitive_verbs:
  # ── §1 leaf tokens Moby classifies as BOTH noun and verb ────────────────
  # The auditor's own message names this file as the remedy for exactly
  # that case: "Moby classifies this as both noun AND verb; if the verb
  # meaning is intended in this CLI context, add to
  # `.scitex/dev/cli-audit-dict.yaml` under `intransitive_verbs:`".
  #
  # Both entries below are the VERB sense in this CLI. Neither is a
  # rename candidate: they are the two oldest operator-facing verbs in
  # scitex-ssh and both match what an operator already types elsewhere
  # (`ssh`-adjacent tooling, `tmux attach`, `mtr`/`ping`-style probing).

  - probe    # `scitex-ssh probe <host>` — ACT of reaching a host and
             # reporting whether it answers. The noun sense ("a probe")
             # would name a stored object; nothing here is stored. The
             # suggested `start-probe` implies a daemon that outlives the
             # command, which is the opposite of what this does — it runs
             # once and prints a verdict.

  - attach   # `scitex-ssh attach <host> [command]` — ACT of attaching the
             # caller's terminal to a session on <host>
             # (`_primitives.py::attach_cmd`). Established by `tmux attach`
             # / `docker attach`, which operators already know; renaming to
             # `start-attach` would break that muscle memory for no gain.
